<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- White background -->
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Simplified blue shield shape (coat of arms outline) -->
  <path d="M450,130 L560,130 L570,420 L450,480 L330,420 L340,130 Z" fill="#1a3a6b"/>
  <!-- White star above shield -->
  <polygon points="450,105 456,123 474,123 460,134 466,152 450,141 434,152 440,134 426,123 444,123" fill="#1a3a6b"/>
  <!-- Simplified Native American figure (white silhouette on blue) -->
  <!-- Head -->
  <circle cx="450" cy="220" r="28" fill="#ffffff"/>
  <!-- Body -->
  <rect x="430" y="248" width="40" height="70" rx="6" fill="#ffffff"/>
  <!-- Arm with bow (simplified) -->
  <rect x="390" y="255" width="50" height="8" rx="4" fill="#ffffff" transform="rotate(-20,440,259)"/>
  <!-- Arrow/bow arc -->
  <path d="M396,248 Q450,210 476,258" stroke="#ffffff" stroke-width="5" fill="none"/>
  <!-- Legs -->
  <rect x="432" y="316" width="16" height="48" rx="4" fill="#ffffff"/>
  <rect x="452" y="316" width="16" height="48" rx="4" fill="#ffffff"/>
  <!-- White arm with sword on right side of shield -->
  <rect x="530" y="200" width="14" height="80" rx="4" fill="#ffffff" transform="rotate(30,537,240)"/>
</svg>
