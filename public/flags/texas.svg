<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <!-- White stripe top-right -->
  <rect x="300" y="0"   width="600" height="300" fill="#ffffff"/>
  <!-- Red stripe bottom-right -->
  <rect x="300" y="300" width="600" height="300" fill="#BF0A30"/>
  <!-- Blue vertical band -->
  <rect x="0"   y="0"   width="300" height="600" fill="#002868"/>
  <!-- White 5-pointed star centered in blue band -->
  <polygon
    points="150,168 177,255 264,255 196,308 221,396 150,344 79,396 104,308 36,255 123,255"
    fill="#ffffff"/>
</svg>
