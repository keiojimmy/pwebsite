<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <rect width="900" height="600" fill="#ffffff"/>
  <!-- Taegeuk: red (yang) top, blue (yin) bottom, horizontal S-curve -->
  <!-- Big circle center (450,300) radius 120; small circles radius 60 at (390,300) and (510,300) -->
  <path d="M330,300 A120,120,0,0,1,570,300 A60,60,0,0,1,450,300 A60,60,0,0,0,330,300 Z" fill="#CD2E3A"/>
  <path d="M330,300 A120,120,0,0,0,570,300 A60,60,0,0,0,450,300 A60,60,0,0,1,330,300 Z" fill="#003478"/>
  <!-- Trigrams — Geon (upper-left): 3 solid bars, rotated -45deg -->
  <g transform="translate(218,168) rotate(-45)">
    <rect x="-52" y="-18" width="104" height="11" fill="#000"/>
    <rect x="-52" y="-2"  width="104" height="11" fill="#000"/>
    <rect x="-52" y="14"  width="104" height="11" fill="#000"/>
  </g>
  <!-- Gon (lower-right): 3 broken bars, rotated -45deg -->
  <g transform="translate(682,432) rotate(-45)">
    <rect x="-52" y="-18" width="44" height="11" fill="#000"/>
    <rect x="8"   y="-18" width="44" height="11" fill="#000"/>
    <rect x="-52" y="-2"  width="44" height="11" fill="#000"/>
    <rect x="8"   y="-2"  width="44" height="11" fill="#000"/>
    <rect x="-52" y="14"  width="44" height="11" fill="#000"/>
    <rect x="8"   y="14"  width="44" height="11" fill="#000"/>
  </g>
  <!-- Gam (upper-right): broken-solid-broken, rotated 45deg -->
  <g transform="translate(682,168) rotate(45)">
    <rect x="-52" y="-18" width="44" height="11" fill="#000"/>
    <rect x="8"   y="-18" width="44" height="11" fill="#000"/>
    <rect x="-52" y="-2"  width="104" height="11" fill="#000"/>
    <rect x="-52" y="14"  width="44" height="11" fill="#000"/>
    <rect x="8"   y="14"  width="44" height="11" fill="#000"/>
  </g>
  <!-- Li (lower-left): solid-broken-solid, rotated 45deg -->
  <g transform="translate(218,432) rotate(45)">
    <rect x="-52" y="-18" width="104" height="11" fill="#000"/>
    <rect x="-52" y="-2"  width="44" height="11" fill="#000"/>
    <rect x="8"   y="-2"  width="44" height="11" fill="#000"/>
    <rect x="-52" y="14"  width="104" height="11" fill="#000"/>
  </g>
</svg>
